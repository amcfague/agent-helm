[package]
name = "agent-helm"
version = "0.1.0"
edition = "2024"

[features]
default = ["serve"]
serve = ["dep:axum", "dep:tokio", "dep:tokio-stream"]

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
crossterm = "0.29"
fs2 = "0.4"
names = { version = "0.14", default-features = false }
portable-pty = "0.9"
ratatui = "0.30"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strum = { version = "0.26", features = ["derive"] }
thiserror = "2"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
vt100 = "0.16"

[dependencies.axum]
version = "0.7"
optional = true

[dependencies.tokio]
version = "1"
features = ["macros", "net", "rt-multi-thread", "time"]
optional = true

[dependencies.tokio-stream]
version = "0.1"
optional = true

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
debug-assertions = false
overflow-checks = false
incremental = false
strip = "symbols"
